<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Caneca verde: A -->
  <rect x="1" y="10" width="20" height="5" rx="2" fill="#2e7d32"/>
  <rect x="8" y="6" width="6" height="5" rx="1.5" fill="#2e7d32"/>
  <polygon points="2,17 20,17 18,58 4,58" fill="#2e7d32" stroke="#2e7d32" stroke-width="3" stroke-linejoin="round"/>
  <text x="11" y="44" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">A</text>

  <!-- Caneca blanca: M -->
  <rect x="22" y="10" width="20" height="5" rx="2" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
  <rect x="29" y="6" width="6" height="5" rx="1.5" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="23,17 41,17 39,58 25,58" fill="#ffffff" stroke="#8a8a8a" stroke-width="3" stroke-linejoin="round"/>
  <text x="32" y="44" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a1a">M</text>

  <!-- Caneca negra: G -->
  <rect x="43" y="10" width="20" height="5" rx="2" fill="#1a1a1a"/>
  <rect x="50" y="6" width="6" height="5" rx="1.5" fill="#1a1a1a"/>
  <polygon points="44,17 62,17 60,58 46,58" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
  <text x="53" y="44" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">G</text>
</svg>